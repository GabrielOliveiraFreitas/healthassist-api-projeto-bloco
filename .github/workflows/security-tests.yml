name: security-tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # semanal: pega CVEs novas em dependências sem precisar de push

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Chave efêmera só para o CI; a app recusa subir sem SECRET_KEY >= 32 chars.
  SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789

jobs:
  lint:
    name: "Gate: lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  sast:
    name: "Gate: SAST (bandit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: bandit -r app scripts -ll   # falha em severidade média ou alta

  sca:
    name: "Gate: dependências vulneráveis (pip-audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt

  tests:
    name: "Gate: testes + cobertura >= 90%"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -v --cov=app --cov=scripts --cov-report=term-missing --cov-fail-under=90

  dast:
    name: "Gate: DAST (OWASP ZAP autenticado)"
    runs-on: ubuntu-latest
    needs: [lint, sast, sca, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements.txt
      - run: bash scripts/run_dast.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap-out/

  gates:
    # Único check a exigir em Settings -> Branches -> Require status checks.
    name: gates
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, sast, sca, tests, dast]
    steps:
      - name: Todos os gates precisam estar verdes
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "Algum gate falhou"; exit 1
          fi
