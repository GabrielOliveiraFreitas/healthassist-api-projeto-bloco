[project]
name = "healthassist-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "python-multipart==0.0.32",
    "pyjwt==2.15.1",
    "python-dotenv==1.2.4",
    "sqlmodel>=0.0.30",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 110
exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["B008"]  # Depends() em defaults é o idioma do FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"app/routes/auth.py" = ["S106"]  # "bearer" é o tipo do token, não uma senha

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
